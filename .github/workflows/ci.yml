name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan history with gitleaks
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose .
          rm gitleaks gitleaks.tar.gz
      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      # `pnpm e2e` builds first, so a build failure fails here before any test runs.
      - run: pnpm e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Fork PRs never get here: the preview token is not exposed to them.
  preview:
    needs: check
    # Dependabot runs get Dependabot secrets, not Actions secrets, so the preview token would be empty.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Wrangler uploads the config the build wrote to build/server/wrangler.json.
      - run: pnpm build
      - name: Upload preview version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          PR_NUMBER: ${{ github.event.number }}
        run: |
          pnpm exec wrangler versions upload --message "PR #${PR_NUMBER}" | tee "$RUNNER_TEMP/upload.log"
          url=$(grep -oE 'https://[^[:space:]]+' <(grep 'Version Preview URL' "$RUNNER_TEMP/upload.log") | head -n 1 || true)
          if [ -n "$url" ]; then
            echo "Preview URL for PR #${PR_NUMBER}: $url" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Version Preview URL was printed for PR #${PR_NUMBER}. Check that preview_urls is enabled." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # Never cancel a run that has started. GitHub keeps one pending run per group and
    # cancels older pending ones, so a pending deploy or rollback can be superseded
    # by a later one. The stale-commit guard below covers re-runs and slow runs.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Skip if main has moved on
        id: head
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
          RUN_SHA: ${{ github.sha }}
        run: |
          head=$(git ls-remote "$REPO_URL" refs/heads/main | cut -f1)
          if [ -z "$head" ]; then
            echo "Could not read the head of main; refusing to deploy." >&2
            exit 1
          fi
          if [ "$head" != "$RUN_SHA" ]; then
            echo "Deploy skipped: ${RUN_SHA} is no longer the head of main (${head}). The newer commit's run deploys it." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.head.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.head.outputs.skip != 'true'
        run: pnpm build
      - name: Deploy to production
        if: steps.head.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: pnpm exec wrangler deploy
